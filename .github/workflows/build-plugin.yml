name: Build and release plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version (e.g. 1.0.0.0)"
        required: true
        default: "1.0.0.0"
      target_abi:
        description: "Minimum Jellyfin server ABI version this build targets"
        required: true
        default: "10.9.0.0"
      changelog:
        description: "Changelog for this release"
        required: false
        default: "See commit history."

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore plugin/Kongflix.MetadataScanner.csproj

      - name: Build
        run: >
          dotnet build plugin/Kongflix.MetadataScanner.csproj
          --configuration Release
          -p:Version=${{ github.event.inputs.version }}

      - name: Test
        run: dotnet test plugin/Kongflix.MetadataScanner.Tests/Kongflix.MetadataScanner.Tests.csproj

      - name: Package
        id: package
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          ZIP_NAME="kongflix-metadata-scanner_${VERSION}.zip"
          OUT_DIR="plugin/bin/Release/net8.0"

          cd "$OUT_DIR"
          zip -j "$GITHUB_WORKSPACE/$ZIP_NAME" Kongflix.MetadataScanner.dll
          cd "$GITHUB_WORKSPACE"

          CHECKSUM=$(md5sum "$ZIP_NAME" | awk '{print $1}')
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-v${{ github.event.inputs.version }}
          name: Plugin v${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.changelog }}
          files: ${{ steps.package.outputs.zip_name }}

      - name: Update manifest.json
        run: |
          python3 scripts/update_plugin_manifest.py \
            --manifest manifest.json \
            --guid 5f3b2c1a-8e4d-4a6b-9c2f-1a2b3c4d5e6f \
            --version "${{ github.event.inputs.version }}" \
            --checksum "${{ steps.package.outputs.checksum }}" \
            --source-url "https://github.com/${{ github.repository }}/releases/download/plugin-v${{ github.event.inputs.version }}/${{ steps.package.outputs.zip_name }}" \
            --target-abi "${{ github.event.inputs.target_abi }}" \
            --changelog "${{ github.event.inputs.changelog }}" \
            --timestamp "${{ steps.package.outputs.timestamp }}"

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && echo "no manifest changes" || git commit -m "chore: publish plugin v${{ github.event.inputs.version }} to repository manifest"
          git push
