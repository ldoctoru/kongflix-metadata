  <path d="M54 64 C53 82 58 88 56 104" stroke="#8b7fd6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M64 65 C64 84 64 90 64 106" stroke="#a89ae0" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M74 64 C75 82 70 88 72 104" stroke="#8b7fd6" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M86 62 C88 78 82 84 84 100" stroke="#8b7fd6" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- poster/metadata card resting on bell -->
  <rect x="50" y="34" width="28" height="20" rx="3" fill="#f4f2ff"/>
  <rect x="54" y="38" width="8" height="8" rx="1.5" fill="#5f4fbf"/>
  <rect x="65" y="39" width="9" height="2" fill="#c9c2f0"/>
  <rect x="65" y="43" width="9" height="2" fill="#c9c2f0"/>
  <rect x="54" y="49" width="20" height="2" fill="#c9c2f0"/>
